name: CARPLEY Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - carpley-1.3
    paths:
      - "desktop/**"
      - "app/**"
      - ".github/workflows/carpley-windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish CARPLEY for Windows x64
        run: dotnet publish desktop/CARPLEY.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CARPLEY-1.3-win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CARPLEY-1.3-Windows-x64
          path: artifacts/CARPLEY-1.3-win-x64/**
          if-no-files-found: error
          retention-days: 14
