name: JVRSMPLAY Windows build and MSI

on:
  workflow_dispatch:
  push:
    branches:
      - carpley-1.3
    paths:
      - "desktop/**"
      - "app/**"
      - "plugin/**"
      - "installer/**"
      - "docs/ETS2-1.62-INTEGRACAO.md"
      - ".github/workflows/carpley-windows-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download official SCS Telemetry SDK 1.16
        shell: pwsh
        run: |
          $sdkZip = Join-Path $env:RUNNER_TEMP "scs_sdk_1_16.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "scs_sdk_1_16"
          Invoke-WebRequest -Uri "https://download.eurotrucksimulator2.com/scs_sdk_1_16.zip" -OutFile $sdkZip
          Expand-Archive -Path $sdkZip -DestinationPath $sdkRoot -Force
          $sdkHeader = Get-ChildItem -Path $sdkRoot -Recurse -Filter "scssdk_telemetry.h" | Select-Object -First 1
          if (!$sdkHeader) { throw "Official SCS SDK telemetry header was not found in the archive." }
          $sdkIncludeDir = $sdkHeader.DirectoryName
          if (!(Test-Path (Join-Path $sdkIncludeDir "common\scssdk_telemetry_truck_common_channels.h"))) {
            throw "Official SCS SDK common truck channel header was not found."
          }
          "SCS_SDK_INCLUDE_DIR=$sdkIncludeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native ETS2 x64 telemetry plugin
        shell: pwsh
        run: |
          cmake -S plugin -B build/plugin -A x64 "-DSCS_SDK_INCLUDE_DIR=$env:SCS_SDK_INCLUDE_DIR"
          cmake --build build/plugin --config Release
          $builtDll = "build/plugin/Release/JVRSMPLAY-ETS2-x64.dll"
          if (!(Test-Path $builtDll)) { throw "Native ETS2 x64 plugin DLL was not generated." }

          $pluginDir = "artifacts/JVRSMPLAY-win-x64/ETS2-Plugin"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item $builtDll (Join-Path $pluginDir "JVRSMPLAY-ETS2-x64.dll")
          Copy-Item "plugin/INSTALL.txt" $pluginDir
          Copy-Item "plugin/LICENSE-SCS-SDK.txt" $pluginDir

          # Verify the PE machine type is AMD64 (x64).
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $pluginDir "JVRSMPLAY-ETS2-x64.dll"))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Plugin DLL has an invalid PE signature." }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Plugin is not x64. PE machine: 0x{0:X4}" -f $machine) }

          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "Visual Studio locator was not found; cannot verify plugin exports." }
          $vsPath = & $vswhere -latest -products "*" -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vsPath "VC\Tools\MSVC") -Filter "dumpbin.exe" -Recurse |
            Where-Object { $_.FullName -like "*\Hostx64\x64\dumpbin.exe" } |
            Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin.exe was not found; cannot verify plugin exports." }
          $exports = (& $dumpbin.FullName /exports (Join-Path $pluginDir "JVRSMPLAY-ETS2-x64.dll")) -join "`n"
          if ($exports -notmatch "\bscs_telemetry_init\b") { throw "Required export scs_telemetry_init is missing." }
          if ($exports -notmatch "\bscs_telemetry_shutdown\b") { throw "Required export scs_telemetry_shutdown is missing." }

      - name: Publish JVRSMPLAY for Windows x64
        run: dotnet publish desktop/CARPLEY.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/JVRSMPLAY-win-x64

      - name: Restore plugin files after app publish
        shell: pwsh
        run: |
          $pluginDir = "artifacts/JVRSMPLAY-win-x64/ETS2-Plugin"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item "build/plugin/Release/JVRSMPLAY-ETS2-x64.dll" $pluginDir -Force
          Copy-Item "plugin/INSTALL.txt" $pluginDir -Force
          Copy-Item "plugin/LICENSE-SCS-SDK.txt" $pluginDir -Force

      - name: Verify native Windows app and ETS2 plugin
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/JVRSMPLAY-win-x64/JVRSMPLAY.exe")) { throw "JVRSMPLAY.exe was not generated." }
          if (!(Test-Path "artifacts/JVRSMPLAY-win-x64/ETS2-Plugin/JVRSMPLAY-ETS2-x64.dll")) { throw "ETS2 x64 plugin DLL was not included." }
          if (Test-Path "artifacts/JVRSMPLAY-win-x64/Microsoft.Web.WebView2*.dll") { throw "Unexpected WebView2 dependency remains in the published app." }

      - name: Scan application and plugin files with Microsoft Defender
        shell: pwsh
        run: |
          Update-MpSignature
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) { throw "Microsoft Defender command-line scanner not found." }
          & $mp -Scan -ScanType 3 -File (Resolve-Path "artifacts/JVRSMPLAY-win-x64")
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported a scan error or detection. Do not distribute this build." }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          wix build installer/Product.wxs -arch x64 -d PublishDir="$((Resolve-Path 'artifacts/JVRSMPLAY-win-x64').Path)" -o artifacts/JVRSMPLAY-Setup-x64.msi
          if (!(Test-Path "artifacts/JVRSMPLAY-Setup-x64.msi")) { throw "MSI was not generated." }

      - name: Scan MSI with Microsoft Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          & $mp -Scan -ScanType 3 -File (Resolve-Path "artifacts/JVRSMPLAY-Setup-x64.msi")
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported a scan error or detection. Do not distribute this MSI." }

      - name: Package standalone ETS2 plugin test ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/JVRSMPLAY-win-x64/ETS2-Plugin/*" -DestinationPath "artifacts/JVRSMPLAY-ETS2-Plugin-x64.zip" -Force

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $msiHash = Get-FileHash "artifacts/JVRSMPLAY-Setup-x64.msi" -Algorithm SHA256
          $pluginHash = Get-FileHash "artifacts/JVRSMPLAY-ETS2-Plugin-x64.zip" -Algorithm SHA256
          "$($msiHash.Hash)  JVRSMPLAY-Setup-x64.msi" | Out-File "artifacts/SHA256.txt" -Encoding ascii
          "$($pluginHash.Hash)  JVRSMPLAY-ETS2-Plugin-x64.zip" | Out-File "artifacts/SHA256.txt" -Append -Encoding ascii

      - name: Publish permanent GitHub Release for successful test builds
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: JVRSMPLAY-v1.3.0-build-${{ github.run_number }}
          name: JVRSM PLAY 1.3.0 - Build ${{ github.run_number }} (teste)
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/JVRSMPLAY-Setup-x64.msi
            artifacts/JVRSMPLAY-ETS2-Plugin-x64.zip
            artifacts/SHA256.txt

      - name: Upload Windows installer and ETS2 plugin
        uses: actions/upload-artifact@v4
        with:
          name: JVRSMPLAY-Windows-x64-Test
          path: |
            artifacts/JVRSMPLAY-Setup-x64.msi
            artifacts/JVRSMPLAY-ETS2-Plugin-x64.zip
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 14
