name: JVRSMPLAY Windows build and MSI

on:
  workflow_dispatch:
  push:
    branches:
      - carpley-1.3
    paths:
      - "desktop/**"
      - "app/**"
      - "installer/**"
      - "docs/ETS2-1.62-INTEGRACAO.md"
      - ".github/workflows/carpley-windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish JVRSMPLAY for Windows x64
        run: dotnet publish desktop/CARPLEY.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/JVRSMPLAY-win-x64

      - name: Verify executable and central files
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/JVRSMPLAY-win-x64/JVRSMPLAY.exe")) { throw "JVRSMPLAY.exe was not generated." }
          if (!(Test-Path "artifacts/JVRSMPLAY-win-x64/app/index.html")) { throw "Central app/index.html was not included." }

      - name: Scan application files with Microsoft Defender
        shell: pwsh
        run: |
          Update-MpSignature
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) { throw "Microsoft Defender command-line scanner not found." }
          & $mp -Scan -ScanType 3 -File (Resolve-Path "artifacts/JVRSMPLAY-win-x64")
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported a scan error or detection. Do not distribute this build." }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          wix build installer/Product.wxs -arch x64 -d PublishDir="$((Resolve-Path 'artifacts/JVRSMPLAY-win-x64').Path)" -o artifacts/JVRSMPLAY-Setup-x64.msi
          if (!(Test-Path "artifacts/JVRSMPLAY-Setup-x64.msi")) { throw "MSI was not generated." }

      - name: Scan MSI with Microsoft Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          & $mp -Scan -ScanType 3 -File (Resolve-Path "artifacts/JVRSMPLAY-Setup-x64.msi")
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported a scan error or detection. Do not distribute this MSI." }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash "artifacts/JVRSMPLAY-Setup-x64.msi" -Algorithm SHA256
          "$($hash.Hash)  JVRSMPLAY-Setup-x64.msi" | Out-File "artifacts/SHA256.txt" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JVRSMPLAY-MSI-x64
          path: |
            artifacts/JVRSMPLAY-Setup-x64.msi
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 14
